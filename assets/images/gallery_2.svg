<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyOcean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fd5e53"/>
      <stop offset="45%" stop-color="#ff9966"/>
      <stop offset="70%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="50%" stop-color="#023e8a"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>
  </defs>
  <!-- Sunset Sky -->
  <rect width="800" height="320" fill="url(#skyOcean)"/>
  <!-- Sunset Sun -->
  <circle cx="400" cy="310" r="70" fill="#fff3b0"/>
  <!-- Sea water -->
  <rect y="310" width="800" height="190" fill="url(#seaGrad)"/>
  <!-- Sun reflection on water -->
  <ellipse cx="400" cy="340" rx="90" ry="12" fill="#ffeaa7" opacity="0.6"/>
  <ellipse cx="400" cy="375" rx="140" ry="14" fill="#ffd166" opacity="0.4"/>
  <ellipse cx="400" cy="420" rx="200" ry="16" fill="#f4a261" opacity="0.25"/>
  <!-- Gentle waves -->
  <path d="M 0 350 Q 200 330 400 350 T 800 350 L 800 500 L 0 500 Z" fill="#0077b6" opacity="0.3"/>
  <path d="M 0 400 Q 250 380 500 400 T 800 400 L 800 500 L 0 500 Z" fill="#023e8a" opacity="0.4"/>
  <!-- Sailboat silhouette -->
  <polygon points="620,290 620,240 660,290" fill="#2b2d42"/>
  <polygon points="615,290 615,250 590,290" fill="#2b2d42"/>
  <path d="M 580 293 Q 620 305 670 293 Z" fill="#1d3557"/>
  <!-- Caption tag -->
  <rect x="30" y="30" width="220" height="42" rx="21" fill="rgba(0,0,0,0.4)"/>
  <text x="140" y="57" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">🌊 Hoàng Hôn Biển Xanh</text>
</svg>
