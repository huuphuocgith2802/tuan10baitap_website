<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05051a"/>
      <stop offset="50%" stop-color="#0c1033"/>
      <stop offset="100%" stop-color="#191d4d"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f5d4" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#7b2cbf" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#ff007f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Night sky -->
  <rect width="800" height="500" fill="url(#nightSky)"/>
  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="50" cy="80" r="1.5" opacity="0.9"/>
    <circle cx="120" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="180" cy="110" r="2" opacity="1"/>
    <circle cx="270" cy="65" r="1.3" opacity="0.7"/>
    <circle cx="340" cy="120" r="1.8" opacity="0.9"/>
    <circle cx="430" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="520" cy="95" r="2.2" opacity="0.95"/>
    <circle cx="610" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="700" cy="110" r="1.3" opacity="0.9"/>
    <circle cx="760" cy="70" r="2" opacity="0.85"/>
    <circle cx="220" cy="180" r="1.5" opacity="0.7"/>
    <circle cx="650" cy="190" r="1.4" opacity="0.8"/>
  </g>
  <!-- Aurora wave 1 -->
  <path d="M 0 160 Q 200 80 400 180 T 800 130 L 800 280 Q 600 320 400 240 T 0 260 Z" fill="url(#auroraGrad)" filter="blur(8px)"/>
  <!-- Aurora wave 2 -->
  <path d="M 0 200 Q 250 120 500 230 T 800 170 L 800 330 Q 550 270 300 340 T 0 280 Z" fill="url(#auroraGrad)" opacity="0.7" filter="blur(12px)"/>
  <!-- Snowy Mountain silhouette -->
  <polygon points="-50,500 180,320 400,500" fill="#090a14"/>
  <polygon points="180,320 155,360 215,360" fill="#e0e7ff" opacity="0.8"/>
  <polygon points="300,500 520,300 740,500" fill="#06070d"/>
  <polygon points="520,300 490,345 560,345" fill="#e0e7ff" opacity="0.8"/>
  <polygon points="550,500 720,360 880,500" fill="#090a14"/>
  <!-- Caption tag -->
  <rect x="30" y="30" width="220" height="42" rx="21" fill="rgba(0,0,0,0.4)"/>
  <text x="140" y="57" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">🌌 Cực Quang Bầu Trời Đêm</text>
</svg>
