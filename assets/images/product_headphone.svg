<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metalArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="cupGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#hpBg)"/>
  <!-- Headband Arc -->
  <path d="M 180 220 C 180 90, 420 90, 420 220" fill="none" stroke="url(#metalArc)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 210 160 C 240 120, 360 120, 390 160" fill="none" stroke="#475569" stroke-width="22" stroke-linecap="round"/>
  <!-- Headband cushion -->
  <path d="M 230 150 C 260 125, 340 125, 370 150" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>

  <!-- Left Earcup -->
  <g transform="translate(140, 180)">
    <rect x="0" y="0" width="45" height="100" rx="22" fill="#0284c7" opacity="0.15" filter="blur(6px)"/>
    <rect x="0" y="0" width="45" height="100" rx="22" fill="url(#cupGrad)" stroke="#38bdf8" stroke-width="3"/>
    <rect x="15" y="10" width="18" height="80" rx="9" fill="#0f172a"/>
    <!-- LED indicator -->
    <circle cx="24" cy="50" r="3" fill="#38bdf8"/>
  </g>

  <!-- Right Earcup -->
  <g transform="translate(415, 180)">
    <rect x="0" y="0" width="45" height="100" rx="22" fill="#0284c7" opacity="0.15" filter="blur(6px)"/>
    <rect x="0" y="0" width="45" height="100" rx="22" fill="url(#cupGrad)" stroke="#38bdf8" stroke-width="3"/>
    <rect x="12" y="10" width="18" height="80" rx="9" fill="#0f172a"/>
    <!-- LED indicator -->
    <circle cx="21" cy="50" r="3" fill="#38bdf8"/>
  </g>

  <!-- Sound Waves / Wireless Icon -->
  <path d="M 110 210 A 30 30 0 0 0 110 250" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 95 195 A 50 50 0 0 0 95 265" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 490 210 A 30 30 0 0 1 490 250" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 505 195 A 50 50 0 0 1 505 265" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Badge text -->
  <text x="300" y="340" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Tai Nghe Wireless Studio ANC Ultra</text>
  <text x="300" y="365" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Chống ồn chủ động 45dB • Thời lượng pin 60 giờ • Hi-Res Audio</text>
</svg>
