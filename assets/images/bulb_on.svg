<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- Bulb ON -->
  <defs>
    <radialGradient id="bulbGlow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#facc15" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="outerAura" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="baseMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer ambient glow circle -->
  <circle cx="100" cy="145" r="90" fill="url(#outerAura)"/>
  
  <!-- Glowing light rays -->
  <g stroke="#facc15" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="218" x2="100" y2="235"/>
    <line x1="38" y1="145" x2="20" y2="145"/>
    <line x1="162" y1="145" x2="180" y2="145"/>
    <line x1="50" y1="95" x2="35" y2="82"/>
    <line x1="150" y1="95" x2="165" y2="82"/>
    <line x1="56" y1="195" x2="42" y2="208"/>
    <line x1="144" y1="195" x2="158" y2="208"/>
  </g>

  <!-- Hanging cord -->
  <line x1="100" y1="0" x2="100" y2="40" stroke="#475569" stroke-width="4"/>
  
  <!-- Base socket -->
  <rect x="85" y="40" width="30" height="16" rx="3" fill="url(#baseMetal)"/>
  <rect x="88" y="56" width="24" height="6" rx="2" fill="#475569"/>
  <rect x="90" y="62" width="20" height="6" rx="2" fill="#334155"/>
  <rect x="92" y="68" width="16" height="5" rx="2" fill="#1e293b"/>

  <!-- Filament glowing bright -->
  <path d="M 90 95 L 96 112 L 100 105 L 104 112 L 110 95" fill="none" stroke="#ea580c" stroke-width="3" filter="url(#glowEffect)"/>
  
  <!-- Bulb Glass Outline -->
  <path d="M 85 73 
           C 60 85, 45 115, 45 145 
           C 45 180, 72 205, 100 205 
           C 128 205, 155 180, 155 145 
           C 155 115, 140 85, 115 73 Z" 
        fill="url(#bulbGlow)" 
        stroke="#ca8a04" 
        stroke-width="3"
        filter="url(#glowEffect)"/>
  
  <!-- Glass reflection highlight -->
  <path d="M 60 130 C 58 145, 68 165, 80 175" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
