<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3: Danh Sách Việc Cần Làm (To-Do List) | LHU Tuần 10</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .todo-card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.4rem;
    }
    p {
      color: #64748b;
      font-size: 0.92rem;
      margin-bottom: 20px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex-grow: 1;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    button.add-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.add-btn:hover {
      background-color: #1d4ed8;
    }
    ul.todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
    }
    li.todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-grow: 1;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    span.todo-text {
      color: #1e293b;
      font-size: 0.95rem;
    }
    li.todo-item.done span.todo-text {
      text-decoration: line-through;
      color: #94a3b8;
    }
    button.del-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 4px;
    }
    button.del-btn:hover {
      background: #fee2e2;
    }
    .back-home {
      display: block;
      margin-top: 24px;
      text-align: center;
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-home:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="todo-card">
    <h2>Bài 3: Danh Sách Việc Cần Làm</h2>
    <p>Nhập công việc vào ô và nhấn "Thêm". Thẻ &lt;li&gt; mới sẽ được tạo động.</p>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="Nhập công việc cần làm..." autocomplete="off">
      <button class="add-btn" id="add-btn">Thêm</button>
    </div>

    <ul class="todo-list" id="todo-list">
      <li class="todo-item done">
        <div class="item-left">
          <input type="checkbox" checked>
          <span class="todo-text">Đọc tài liệu W3Schools về DOM</span>
        </div>
        <button class="del-btn" title="Xóa">🗑️</button>
      </li>
      <li class="todo-item">
        <div class="item-left">
          <input type="checkbox">
          <span class="todo-text">Hoàn thành bài tập tuần 10</span>
        </div>
        <button class="del-btn" title="Xóa">🗑️</button>
      </li>
    </ul>

    <a href="../../index.html" class="back-home">← Quay lại trang chủ Tuần 10</a>
  </div>

  <script>
    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');

    function addTask() {
      const text = todoInput.value.trim();
      if (text === '') {
        todoInput.focus();
        return;
      }

      // Tạo thẻ li mới
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = `
        <div class="item-left">
          <input type="checkbox">
          <span class="todo-text">${text}</span>
        </div>
        <button class="del-btn" title="Xóa">🗑️</button>
      `;

      // Checkbox hoàn thành
      const cb = li.querySelector('input[type="checkbox"]');
      cb.addEventListener('change', () => {
        li.classList.toggle('done', cb.checked);
      });

      // Nút xóa
      const del = li.querySelector('.del-btn');
      del.addEventListener('click', () => {
        li.remove();
      });

      todoList.appendChild(li);
      todoInput.value = '';
      todoInput.focus();
    }

    addBtn.addEventListener('click', addTask);
    todoInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    // Gán sự kiện cho các item có sẵn ban đầu
    document.querySelectorAll('.todo-item').forEach(item => {
      const cb = item.querySelector('input[type="checkbox"]');
      cb.addEventListener('change', () => item.classList.toggle('done', cb.checked));
      const del = item.querySelector('.del-btn');
      del.addEventListener('click', () => item.remove());
    });
  </script>
</body>
</html>
